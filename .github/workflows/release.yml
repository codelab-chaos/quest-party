name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 or 0.2.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from package import normalize_version
          version = normalize_version(os.environ['REQUESTED_VERSION'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag=v{version}\n')
          PY
      - name: Refuse to reuse a tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > /tmp/release-refs.json
          python3 - <<'PY'
          import json
          import os
          with open('/tmp/release-refs.json') as source:
              refs = json.load(source)
          tag = 'refs/tags/' + os.environ['RELEASE_TAG']
          if any(ref['ref'] == tag for ref in refs):
              raise SystemExit('Tag already exists. Re-run its tag-triggered Release workflow instead.')
          PY

  build:
    name: Release checks
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: QuestParty-build
          path: dist
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$RELEASE_COMMIT" \
            --title "Quest Party $RELEASE_VERSION" \
            --generate-notes "${flags[@]}"
